name: Refresh dashboard

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch FoxESS data and refresh index.html
        env:
          FOXESS_API_KEY: ${{ secrets.FOXESS_API_KEY }}
          FOXESS_DEVICE_SN: ${{ secrets.FOXESS_DEVICE_SN }}
        run: python scripts/refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "foxess-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/cheap_rate_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh dashboard data"
            git push
          fi
